<app-dialog-header icon="las la-exclamation" title="{{ 'DialogTitles.Error' | translate }}"></app-dialog-header>
<mat-dialog-content>
    <p *ngIf="!data.isGlobalError">{{ data.errorText }}</p>
    <p *ngIf="data.isGlobalError">{{ 'ErrorTexts.GlobalError' | translate }}</p>
</mat-dialog-content>
<mat-dialog-actions>
    <app-accent-button [mat-dialog-close]>{{ 'Buttons.Ok' | translate }}</app-accent-button>
    <app-transparent-button [mat-dialog-close] (click)="viewLog()">{{ 'Buttons.ViewLog' | translate }}</app-transparent-button>
</mat-dialog-actions>
